name: Alpha Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      alpha_smoke_base_url:
        description: Optional deployed PHP base URL for hosted alpha smoke.
        required: false
        type: string

jobs:
  alpha-local:
    name: Local alpha gate
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps
      - name: Run local alpha gate
        run: bun run alpha:gate
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: alpha-report-local
          path: |
            report/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30

  hosted-smoke:
    name: Hosted alpha smoke
    needs: alpha-local
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.alpha_smoke_base_url != '' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps
      - name: Run hosted alpha gate
        env:
          ALPHA_SMOKE_BASE_URL: ${{ inputs.alpha_smoke_base_url }}
        run: bun run alpha:gate:hosted
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: alpha-report-hosted
          path: report/
          if-no-files-found: ignore
          retention-days: 30
