name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run check
      - name: Build adapter
        run: bun run build:adapter
      - name: Build E2E artifacts
        run: bun run build:e2e
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps
      - name: Run Unit Tests
        run: bun run test:unit
      - name: Run PHP Static Verification
        run: bun scripts/verify-all.mjs --mode=php-static --skipBuild
      - name: Run Full Verification
        run: bun scripts/verify-all.mjs --mode=all --skipBuild
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
